
<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hemodiyaliz Bekleme Ekranı</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='tv_ekrani.css') }}">
</head>

<body>

    <main class="tv-container">

        
        <header class="tv-navbar">

            <div class="tv-kurum">
                <div class="tv-logo">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="Kocaeli Üniversitesi Hastanesi">
                </div>

                <div class="tv-kurum-yazi">
                    <span>KOCAELİ ÜNİVERSİTESİ</span>
                    <span>HASTANESİ</span>
                </div>
            </div>

            <div class="tv-baslik">
                <h1>HEMODİYALİZ BEKLEME EKRANI</h1>
                <div id="tvTarihSaat">Tarih ve saat yükleniyor...</div>
            </div>

            <div class="tv-toplam-hasta">
            <span class="toplam-hasta-baslik">TOPLAM HASTA</span>
            <span id="toplamHastaSayisi">0</span>
        </div>

        </header>


        <section id="hastaListesi" class="hasta-listesi">

            <div class="bilgi-mesaji">
                Hasta bilgileri yükleniyor...
            </div>

        </section>

        <footer class="tv-footer">
            <span id="baglantiDurumu">Bağlantı kuruluyor...</span>
            <span>Hasta bilgileriniz gizlilik ilkeleri doğrultusunda gösterilmektedir.</span>
        </footer>

    </main>

    <script src="{{ url_for('static', filename='tv_ekrani.js') }}"></script>

</body>
</html>
